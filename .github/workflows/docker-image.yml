name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    tags: [ '*' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # ← 手动触发

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v5
    -
      name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    -
      name: Read image versions from Dockerfile
      id: versions
      shell: bash
      run: |
        POSTGRES_VERSION=$(sed -n 's/^ARG POSTGRES_VERSION=//p' Dockerfile)
        ALPINE_VERSION=$(sed -n 's/^ARG ALPINE_VERSION=//p' Dockerfile)
        PGVECTOR_VERSION=$(sed -n 's/^ARG PGVECTOR_VERSION=//p' Dockerfile)
        echo "image_version=${POSTGRES_VERSION}-alpine${ALPINE_VERSION}-pgvector${PGVECTOR_VERSION}" >> "$GITHUB_OUTPUT"
    -
      name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    -
      name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    -
      name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: |
          linux/amd64
          linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/postgres:${{ steps.versions.outputs.image_version }}
          ${{ secrets.DOCKER_HUB_USERNAME }}/postgres:latest
          ghcr.io/${{ github.repository_owner }}/postgres:${{ steps.versions.outputs.image_version }}
          ghcr.io/${{ github.repository_owner }}/postgres:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
